<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskmaster - A Project Task Manager</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS for additional styling and animations -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
        }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Animation for modals and notifications */
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        .fade-out {
            animation: fadeOut 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }
        .notification {
            animation: slideIn 0.5s forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- Main Application Container -->
    <div id="app" class="min-h-screen p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <header class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Project Dashboard</h1>
                    <p class="text-gray-500">Organize, track, and accomplish your goals.</p>
                </div>
                <button id="add-project-btn" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:bg-indigo-700 transition-colors">
                    + New Project
                </button>
            </header>

            <!-- Projects Grid -->
            <main id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Project cards will be dynamically inserted here -->
            </main>
            
            <div id="no-projects-view" class="hidden text-center py-16">
                 <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                 </svg>
                 <h3 class="mt-2 text-sm font-medium text-gray-900">No projects</h3>
                 <p class="mt-1 text-sm text-gray-500">Get started by creating a new project.</p>
            </div>

        </div>
    </div>
    
    <!-- Modals Container -->
    <div id="modal-container"></div>
    
    <!-- Notifications Container -->
    <div id="notification-container" class="fixed bottom-5 right-5 space-y-3 z-50 w-full max-w-sm"></div>


    <!-- Web Worker Script -->
    <script id="worker" type="javascript/worker">
        // This script runs in a separate thread and handles background tasks like checking for deadlines.
        let intervalId = null;

        // Function to check for upcoming or overdue deadlines.
        function checkDeadlines(projects) {
            const now = new Date().getTime();
            const notifications = [];

            // Iterate through each project, its tasks, and their to-do items.
            projects.forEach(project => {
                project.tasks.forEach(task => {
                    task.todos.forEach(todo => {
                        if (todo.completed) return; // Skip completed todos

                        const dueDate = new Date(todo.endDate).getTime();
                        const timeDiff = dueDate - now;
                        const oneDay = 24 * 60 * 60 * 1000;
                        
                        // Notify if a to-do item is due within 24 hours or is overdue.
                        if (timeDiff < oneDay) {
                             notifications.push({
                                id: todo.id,
                                message: `'${todo.description}' from project '${project.name}' is due soon or overdue.`,
                                type: timeDiff < 0 ? 'overdue' : 'due_soon'
                            });
                        }
                    });
                });
            });
            
            // Send the collected list of active notifications back to the main thread.
            self.postMessage(notifications);
        }

        // Listen for messages from the main thread.
        self.onmessage = function(e) {
            const projects = e.data;
            // Clear any existing interval to restart the timer with fresh data.
            if (intervalId) {
                clearInterval(intervalId);
            }

            // Perform an immediate check when data is updated.
            checkDeadlines(projects);

            // Set up a new interval for periodic checks.
            intervalId = setInterval(() => {
                checkDeadlines(projects);
            }, 30000); // Check every 30 seconds
        };
    </script>
    
    <!-- Main Application JavaScript -->
    <script type="module">
        // DOM element references
        const app = document.getElementById('app');
        const projectsGrid = document.getElementById('projects-grid');
        const addProjectBtn = document.getElementById('add-project-btn');
        const modalContainer = document.getElementById('modal-container');
        const notificationContainer = document.getElementById('notification-container');
        const noProjectsView = document.getElementById('no-projects-view');

        // State management
        let state = {
            projects: [],
        };
        
        // --- Web Worker Setup ---
        let worker;
        try {
            // Create a blob from the worker script content to run it.
            const workerScript = document.getElementById('worker').textContent;
            const blob = new Blob([workerScript], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            // Listen for messages (notifications) from the worker.
            worker.onmessage = function(e) {
                const activeNotifications = e.data;
                // Clear the current notifications and render the updated list.
                notificationContainer.innerHTML = '';
                activeNotifications.forEach(notification => {
                    showNotification(notification.message, notification.type === 'overdue' ? 'error' : 'info');
                });
                // Vibrate if there are new alerts.
                if (activeNotifications.length > 0 && navigator.vibrate) {
                    navigator.vibrate(200); // Vibrate for 200ms
                }
            };
        } catch (e) {
            console.error('Error initializing web worker:', e);
        }

        // --- Data Persistence using localStorage ---
        
        // Load data from localStorage when the app starts.
        function loadState() {
            const savedState = localStorage.getItem('taskManagerData');
            if (savedState) {
                state = JSON.parse(savedState);
            }
            updateWorkerState();
        }

        // Save the current state to localStorage.
        function saveState() {
            localStorage.setItem('taskManagerData', JSON.stringify(state));
            updateWorkerState();
        }

        // Send the latest project data to the web worker for immediate re-evaluation.
        function updateWorkerState() {
            if(worker) {
                worker.postMessage(state.projects);
            }
        }

        // --- Core Application Logic (CRUD operations) ---

        // Project functions
        const projectManager = {
            add: (name, startDate, endDate, features) => {
                const newProject = {
                    id: `proj_${Date.now()}`,
                    name,
                    startDate,
                    endDate,
                    features,
                    tasks: [],
                };
                state.projects.push(newProject);
                saveState();
                render();
            },
            delete: (id) => {
                state.projects = state.projects.filter(p => p.id !== id);
                saveState();
                render();
                closeModal();
            },
            findById: (id) => state.projects.find(p => p.id === id),
        };

        // Task functions
        const taskManager = {
            add: (projectId, name) => {
                const project = projectManager.findById(projectId);
                if (project) {
                    project.tasks.push({
                        id: `task_${Date.now()}`,
                        name,
                        todos: [],
                    });
                    saveState();
                }
            },
            delete: (projectId, taskId) => {
                const project = projectManager.findById(projectId);
                if (project) {
                    project.tasks = project.tasks.filter(t => t.id !== taskId);
                    saveState();
                }
            },
            findById: (projectId, taskId) => {
                const project = projectManager.findById(projectId);
                return project ? project.tasks.find(t => t.id === taskId) : null;
            },
        };
        
        // To-do functions
        const todoManager = {
            add: (projectId, taskId, description, startDate, endDate) => {
                const task = taskManager.findById(projectId, taskId);
                if (task) {
                    task.todos.push({
                        id: `todo_${Date.now()}`,
                        description,
                        startDate,
                        endDate,
                        completed: false,
                    });
                    saveState();
                }
            },
            delete: (projectId, taskId, todoId) => {
                const task = taskManager.findById(projectId, taskId);
                if (task) {
                    task.todos = task.todos.filter(td => td.id !== todoId);
                    saveState();
                }
            },
            toggle: (projectId, taskId, todoId) => {
                const task = taskManager.findById(projectId, taskId);
                if (task) {
                    const todo = task.todos.find(td => td.id === todoId);
                    if(todo) todo.completed = !todo.completed;
                    saveState(); // This will trigger the worker to update notifications.
                }
            },
        };

        // --- UI Rendering ---

        // Main render function to update the entire UI.
        function render() {
            projectsGrid.innerHTML = '';
            if (state.projects.length === 0) {
                noProjectsView.classList.remove('hidden');
                projectsGrid.classList.add('hidden');
            } else {
                noProjectsView.classList.add('hidden');
                projectsGrid.classList.remove('hidden');
                state.projects.forEach(project => {
                    const projectCard = createProjectCard(project);
                    projectsGrid.appendChild(projectCard);
                });
            }
        }
        
        // Create an HTML element for a single project card.
        function createProjectCard(project) {
            const card = document.createElement('div');
            card.className = 'bg-white p-5 rounded-xl shadow-sm hover:shadow-lg transition-shadow cursor-pointer';
            card.dataset.projectId = project.id;

            const totalTodos = project.tasks.reduce((acc, task) => acc + task.todos.length, 0);
            const completedTodos = project.tasks.reduce((acc, task) => acc + task.todos.filter(t => t.completed).length, 0);
            const progress = totalTodos > 0 ? Math.round((completedTodos / totalTodos) * 100) : 0;
            
            const timeTotal = new Date(project.endDate).getTime() - new Date(project.startDate).getTime();
            const timeSpent = new Date().getTime() - new Date(project.startDate).getTime();
            const timeProgress = timeTotal > 0 ? Math.min(100, Math.round((timeSpent / timeTotal) * 100)) : 0;


            card.innerHTML = `
                <div class="flex justify-between items-start">
                    <h3 class="text-lg font-bold text-gray-800">${project.name}</h3>
                    <span class="text-xs font-semibold ${timeProgress > 85 ? 'text-red-600' : 'text-gray-500'}">${new Date(project.startDate).toLocaleDateString()} - ${new Date(project.endDate).toLocaleDateString()}</span>
                </div>
                <p class="text-sm text-gray-500 mt-2 line-clamp-2">Features: ${project.features}</p>
                <div class="mt-4">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-gray-600">Task Progress</span>
                        <span class="text-sm font-medium text-indigo-600">${progress}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div class="bg-indigo-600 h-2.5 rounded-full" style="width: ${progress}%"></div>
                    </div>
                </div>
                <div class="mt-3">
                    <div class="flex justify-between mb-1">
                        <span class="text-sm font-medium text-gray-600">Time Elapsed</span>
                        <span class="text-sm font-medium ${timeProgress > 85 ? 'text-red-600' : 'text-green-600'}">${timeProgress}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div class="${timeProgress > 85 ? 'bg-red-500' : 'bg-green-500'} h-2.5 rounded-full" style="width: ${timeProgress}%"></div>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => showProjectDetailsModal(project.id));
            return card;
        }
        
        // --- Modal Management ---
        function openModal(content) {
            modalContainer.innerHTML = content;
            modalContainer.querySelector('[data-modal]').classList.add('fade-in');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            const modal = modalContainer.querySelector('[data-modal]');
            if (modal) {
                modal.classList.remove('fade-in');
                modal.classList.add('fade-out');
                modal.addEventListener('animationend', () => {
                    modalContainer.innerHTML = '';
                    document.body.style.overflow = 'auto';
                }, { once: true });
            }
        }
        
        // Modal for creating a new project.
        function showNewProjectModal() {
            const today = new Date().toISOString().split('T')[0];
            const modalContent = `
                <div data-modal class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 z-40">
                    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-bold">Create New Project</h2>
                            <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800">&times;</button>
                        </div>
                        <form id="new-project-form">
                            <div class="mb-4">
                                <label for="project-name" class="block text-sm font-medium text-gray-700">Project Name</label>
                                <input type="text" id="project-name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                            </div>
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label for="start-date" class="block text-sm font-medium text-gray-700">Start Date</label>
                                    <input type="date" id="start-date" value="${today}" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                                </div>
                                <div>
                                    <label for="end-date" class="block text-sm font-medium text-gray-700">End Date</label>
                                    <input type="date" id="end-date" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                                </div>
                            </div>
                             <div class="mb-4">
                                <label for="project-features" class="block text-sm font-medium text-gray-700">Key Features (comma-separated)</label>
                                <textarea id="project-features" rows="2" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500"></textarea>
                            </div>
                            <div class="flex justify-end gap-3">
                                <button type="button" id="cancel-modal-btn" class="bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300">Cancel</button>
                                <button type="submit" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700">Create Project</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            openModal(modalContent);
        }
        
        // Modal for viewing project details, tasks, and to-do lists.
        function showProjectDetailsModal(projectId) {
            const project = projectManager.findById(projectId);
            if (!project) return;
            
            const renderTasks = () => project.tasks.map(task => `
                <div class="bg-gray-50 p-4 rounded-lg mb-3" data-task-id="${task.id}">
                    <div class="flex justify-between items-center">
                        <h4 class="font-semibold text-gray-700">${task.name}</h4>
                        <button class="delete-task-btn text-gray-400 hover:text-red-600 text-xs" data-task-id="${task.id}">Delete Task</button>
                    </div>
                    <div class="mt-2 pl-2 border-l-2 border-gray-200 space-y-2">
                        ${task.todos.map(todo => `
                            <div class="flex items-center justify-between">
                               <div class="flex items-center">
                                    <input type="checkbox" id="todo-${todo.id}" data-todo-id="${todo.id}" class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" ${todo.completed ? 'checked' : ''}>
                                    <label for="todo-${todo.id}" class="ml-2 text-sm text-gray-600 ${todo.completed ? 'line-through text-gray-400' : ''}">${todo.description}</label>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-xs text-gray-400">${new Date(todo.startDate).toLocaleDateString()} - ${new Date(todo.endDate).toLocaleDateString()}</span>
                                    <button class="delete-todo-btn text-gray-400 hover:text-red-500 text-lg" data-todo-id="${todo.id}" data-task-id="${task.id}">&times;</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <form class="new-todo-form mt-3" data-task-id="${task.id}">
                        <div class="flex gap-2">
                            <input type="text" placeholder="+ Add a to-do step" required class="flex-grow text-sm rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring-indigo-300">
                            <input type="date" required class="text-sm rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring-indigo-300" title="Start Date">
                            <input type="date" required class="text-sm rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring-indigo-300" title="End Date">
                            <button type="submit" class="bg-indigo-500 text-white text-sm px-3 rounded-md hover:bg-indigo-600">Add</button>
                        </div>
                    </form>
                </div>
            `).join('');

            const modalContent = `
                <div data-modal class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-start p-4 z-40 overflow-y-auto">
                    <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl my-8">
                        <div class="p-6 border-b">
                            <div class="flex justify-between items-center">
                                <h2 class="text-2xl font-bold">${project.name}</h2>
                                <button id="close-modal-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                            </div>
                            <p class="text-sm text-gray-500 mt-1">${new Date(project.startDate).toLocaleDateString()} to ${new Date(project.endDate).toLocaleDateString()}</p>
                            <p class="text-sm text-gray-600 mt-2">${project.features}</p>
                        </div>
                        <div class="p-6 max-h-[60vh] overflow-y-auto" id="tasks-container">
                            ${renderTasks()}
                        </div>
                        <div class="p-6 border-t bg-gray-50 rounded-b-lg">
                            <form id="new-task-form" class="flex gap-3">
                                <input type="text" id="new-task-name" placeholder="Enter new project phase/task..." required class="flex-grow rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
                                <button type="submit" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700">Add Phase</button>
                            </form>
                        </div>
                         <div class="p-4 bg-gray-100 flex justify-end">
                            <button id="delete-project-btn" data-project-id="${project.id}" class="bg-red-600 text-white text-sm font-semibold py-2 px-4 rounded-lg hover:bg-red-700">Delete Project</button>
                        </div>
                    </div>
                </div>
            `;
            openModal(modalContent);

            // Dynamically attach event listeners for the new content
            const tasksContainer = document.getElementById('tasks-container');

            tasksContainer.addEventListener('submit', (e) => {
                if(e.target.classList.contains('new-todo-form')) {
                    e.preventDefault();
                    const taskId = e.target.dataset.taskId;
                    const description = e.target.children[0].children[0].value;
                    const startDate = e.target.children[0].children[1].value;
                    const endDate = e.target.children[0].children[2].value;

                    if (new Date(endDate) < new Date(startDate)) {
                        showNotification('To-do end date cannot be before start date.', 'error');
                        return;
                    }
                    if (new Date(endDate) > new Date(project.endDate) || new Date(startDate) < new Date(project.startDate)) {
                        showNotification('To-do dates must be within the project timeline.', 'error');
                        return;
                    }

                    todoManager.add(projectId, taskId, description, startDate, endDate);
                    showProjectDetailsModal(projectId); // Re-render modal
                }
            });

            tasksContainer.addEventListener('change', (e) => {
                if (e.target.type === 'checkbox') {
                    const todoId = e.target.dataset.todoId;
                    const taskId = e.target.closest('[data-task-id]').dataset.taskId;
                    todoManager.toggle(projectId, taskId, todoId);
                    // No full re-render for checkbox, just update styles for instant feedback.
                    e.target.nextElementSibling.classList.toggle('line-through');
                    e.target.nextElementSibling.classList.toggle('text-gray-400');
                    render(); // Re-render main grid to update progress bars.
                }
            });
            
            tasksContainer.addEventListener('click', (e) => {
                if(e.target.classList.contains('delete-todo-btn')) {
                    const todoId = e.target.dataset.todoId;
                    const taskId = e.target.dataset.taskId;
                    todoManager.delete(projectId, taskId, todoId);
                    showProjectDetailsModal(projectId);
                }
                 if(e.target.classList.contains('delete-task-btn')) {
                    const taskId = e.target.dataset.taskId;
                    taskManager.delete(projectId, taskId);
                    showProjectDetailsModal(projectId);
                }
            });
        }
        
        // --- Notification System ---
        function showNotification(message, type = 'info') {
            const bgColor = type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            const notification = document.createElement('div');
            notification.className = `notification flex items-center justify-between text-white text-sm py-2 px-4 rounded-lg shadow-lg ${bgColor}`;
            
            const messageSpan = document.createElement('span');
            messageSpan.textContent = message;

            const closeButton = document.createElement('button');
            closeButton.innerHTML = '&times;';
            closeButton.className = 'ml-4 font-bold text-xl leading-none opacity-70 hover:opacity-100';
            closeButton.onclick = () => {
                notification.style.animation = 'slideOut 0.3s forwards';
                notification.addEventListener('animationend', () => notification.remove());
            };

            notification.appendChild(messageSpan);
            notification.appendChild(closeButton);
            notificationContainer.appendChild(notification);
        }

        // --- Event Listeners ---
        
        // Global listener for opening/closing modals and form submissions.
        document.addEventListener('click', (e) => {
            if (e.target.id === 'add-project-btn') {
                showNewProjectModal();
            }
            if (e.target.id === 'close-modal-btn' || e.target.id === 'cancel-modal-btn') {
                closeModal();
            }
            if (e.target.id === 'delete-project-btn') {
                if (confirm('Are you sure you want to delete this project and all its data?')) {
                    projectManager.delete(e.target.dataset.projectId);
                }
            }
        });

        document.addEventListener('submit', (e) => {
            if (e.target.id === 'new-project-form') {
                e.preventDefault();
                const name = document.getElementById('project-name').value;
                const startDate = document.getElementById('start-date').value;
                const endDate = document.getElementById('end-date').value;
                const features = document.getElementById('project-features').value;

                if (new Date(endDate) < new Date(startDate)) {
                    showNotification('Project end date cannot be before start date.', 'error');
                    return;
                }

                projectManager.add(name, startDate, endDate, features);
                closeModal();
            }
            if(e.target.id === 'new-task-form') {
                e.preventDefault();
                const projectId = document.getElementById('delete-project-btn').dataset.projectId;
                const taskName = document.getElementById('new-task-name').value;
                taskManager.add(projectId, taskName);
                showProjectDetailsModal(projectId); // Re-render modal to show new task
            }
        });

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            render();
        });
    </script>
</body>
</html>
